name: PR check
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check GraphQL queries
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check GraphQL queries
        run: node .github/check-graphql.mjs
